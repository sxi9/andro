[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "android-sentinel"
version = "0.1.0"
description = "Local, defensive monitoring dashboard for your own rooted Android device over ADB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
geoip = ["geoip2>=4.8"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
android-sentinel = "sentinel.__main__:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.setuptools.package-data]
"sentinel.server" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
